spring:
  application:
    name: ribeira-backend
  profiles:
    default: dev
  datasource:
    url: ${RIBEIRA_DB_URL:jdbc:postgresql://localhost:5432/ribeira}
    username: ${RIBEIRA_DB_USERNAME:ribeira}
    password: ${RIBEIRA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é responsabilidade exclusiva do Flyway.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        # Sem order_inserts: entidades de módulos diferentes se referenciam por UUID, sem
        # associação JPA, então a ordem de persistência precisa ser preservada.
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200
        serialization-mode: via_dto
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

ribeira:
  security:
    jwt-secret: ${RIBEIRA_JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: ${RIBEIRA_COOKIE_SECURE:true}
    cors-allowed-origins: ${RIBEIRA_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    login-max-failures: 5
    login-failure-window: 15m
  bootstrap:
    organization-name: ${RIBEIRA_BOOTSTRAP_ORGANIZATION_NAME:}
    admin-email: ${RIBEIRA_BOOTSTRAP_ADMIN_EMAIL:}
    admin-name: ${RIBEIRA_BOOTSTRAP_ADMIN_NAME:}
    admin-password: ${RIBEIRA_BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    enabled: ${RIBEIRA_DEMO_DATA_ENABLED:false}
    password: ${RIBEIRA_DEMO_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    com.ribeira: INFO
  pattern:
    correlation: "[%X{correlationId:-}] "

---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  server:
    # Métricas e probes em porta interna, nunca publicada no proxy.
    port: 8081
