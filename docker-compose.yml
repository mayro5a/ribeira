# Ambiente local completo: PostgreSQL + backend + frontend (nginx).
# Uso: cp .env.example .env  (preencha os segredos)  &&  docker compose up --build
name: ribeira

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ribeira}
      POSTGRES_USER: ${POSTGRES_USER:-ribeira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./ribeira-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      RIBEIRA_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ribeira}
      RIBEIRA_DB_USERNAME: ${POSTGRES_USER:-ribeira}
      RIBEIRA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      RIBEIRA_JWT_SECRET: ${RIBEIRA_JWT_SECRET:?defina RIBEIRA_JWT_SECRET no .env}
      RIBEIRA_CORS_ALLOWED_ORIGINS: ${RIBEIRA_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RIBEIRA_COOKIE_SECURE: ${RIBEIRA_COOKIE_SECURE:-false}
      RIBEIRA_BOOTSTRAP_ORGANIZATION_NAME: ${RIBEIRA_BOOTSTRAP_ORGANIZATION_NAME:-}
      RIBEIRA_BOOTSTRAP_ADMIN_EMAIL: ${RIBEIRA_BOOTSTRAP_ADMIN_EMAIL:-}
      RIBEIRA_BOOTSTRAP_ADMIN_NAME: ${RIBEIRA_BOOTSTRAP_ADMIN_NAME:-}
      RIBEIRA_BOOTSTRAP_ADMIN_PASSWORD: ${RIBEIRA_BOOTSTRAP_ADMIN_PASSWORD:-}
      RIBEIRA_DEMO_DATA_ENABLED: ${RIBEIRA_DEMO_DATA_ENABLED:-false}
      RIBEIRA_DEMO_PASSWORD: ${RIBEIRA_DEMO_PASSWORD:-}
      MANAGEMENT_SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./ribeira-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    restart: unless-stopped

volumes:
  postgres-data:
